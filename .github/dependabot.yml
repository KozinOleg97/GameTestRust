version: 2
updates:
  # Экшены пиннятся мажорными тегами — обновляем регулярно.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Cargo-зависимости: раз в месяц, чтобы не заваливать PR-ами.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
